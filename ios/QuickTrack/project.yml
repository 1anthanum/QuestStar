name: QuickTrack
options:
  bundleIdPrefix: com.jaciecrown
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  QuickTrack:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: QuickTrack
        excludes:
          - "**/*.xcassets"
      - path: Shared
    resources:
      - path: QuickTrack/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaciecrown.quicktrack
        INFOPLIST_KEY_CFBundleDisplayName: QuickTrack
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSHealthShareUsageDescription: "QuickTrack reads sleep data to display on your widget."
    entitlements:
      path: QuickTrack/QuickTrack.entitlements
      properties:
        com.apple.security.application-groups:
          - group.quicktrack.shared
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  QuickTrackWidget:
    type: app-extension
    platform: [iOS, macOS]
    sources:
      - path: QuickTrackWidget
        excludes:
          - "**/*.xcassets"
      - path: Shared
      - path: QuickTrack/Models
      - path: QuickTrack/DataSources
    resources:
      - path: QuickTrackWidget/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaciecrown.quicktrack.widget
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: QuickTrack Widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: QuickTrackWidget/QuickTrackWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.quicktrack.shared
    # Widget shares code via source includes, no target dependency needed
