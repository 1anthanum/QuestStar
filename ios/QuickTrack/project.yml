name: QuickTrack
options:
  bundleIdPrefix: com.jaciecrown
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  QuickTrack:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: QuickTrack
        excludes:
          - "**/*.xcassets"
      - path: Shared
    resources:
      - path: QuickTrack/Assets.xcassets
    dependencies:
      - target: QuickTrackWidget_iOS
        embed: true
        platformFilter: iOS
      - target: QuickTrackWidget_macOS
        embed: true
        platformFilter: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaciecrown.quicktrack
        INFOPLIST_FILE: QuickTrack/Info.plist
    entitlements:
      path: QuickTrack/QuickTrack.entitlements
      properties:
        com.apple.security.application-groups:
          - group.quicktrack.shared
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  QuickTrackWidget:
    type: app-extension
    platform: [iOS, macOS]
    sources:
      - path: QuickTrackWidget
        excludes:
          - "**/*.xcassets"
      - path: Shared
      - path: QuickTrack/Models
      - path: QuickTrack/DataSources
      - path: QuickTrack/Intents
    resources:
      - path: QuickTrackWidget/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaciecrown.quicktrack.widget
        INFOPLIST_FILE: QuickTrackWidget/Info.plist
    entitlements:
      path: QuickTrackWidget/QuickTrackWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.quicktrack.shared
    # Widget shares code via source includes, no target dependency needed
